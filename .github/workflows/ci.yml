name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        nim-version:
          - "2.0.x"
          - "2.2.x"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev libpcre3-dev

      - name: Setup Nim ${{ matrix.nim-version }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache nimble packages
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: nimble-${{ matrix.nim-version }}-${{ hashFiles('**/*.nimble') }}

      - name: Build agent
        working-directory: talos_agent
        run: nimble build -y

      - name: Test agent
        working-directory: talos_agent
        # dbus-run-session: the runner has no session bus, and the browser
        # tool's live-Chrome tests fail to launch without one (Chrome's
        # dbus/bus.cc errors immediately, and the cdp launcher treats any
        # stray stderr line before "DevTools listening" as a fatal error).
        run: dbus-run-session -- nimble test -y
        env:
          CI: "true"

      - name: Build code
        working-directory: talos_code
        run: nimble build -y

      - name: Test code
        working-directory: talos_code
        run: nimble test -y
        env:
          CI: "true"
